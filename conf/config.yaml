# Set defense.mode=caga for CAGA; none, norm_clip, fltrust and root_client are comparison baselines.
# fltrust shares root_frac and root_device with caga. defense.fltrust_root_obs sets how many root
# edges the FLTrust server samples per round (default: local_observations.observations_per_client).
defaults:
- _self_
dataset:
  name: ogbl-ddi
  root: ./data
  num_anchors: 0
  use_features: false
  feature_types: []
fixed_features:
  num_anchors: 32
  num_spectral: 16
model:
  hidden_dim: 500
  num_layers: 2
  dropout: 0.3
  normalize: false
predictor:
  hidden_dim: 512
  num_layers: 3
  dropout: 0.3
training:
  num_runs: 3
  epochs: 500
  batch_size: 65536
  num_neg_samples: 1
  lr: 0.003
  weight_decay: 0.0
  eval_interval: 5
  patience: 50
  save_dir: ./checkpoints
  seed: 0
  grad_clip: 1.0
  # Cosine learning-rate decay across federated rounds (otherwise each round restarts at lr).
  round_lr_decay: false
wandb:
  mode: disabled
  project: fedddi-gnn
  entity: null
  tags:
  - graphsage
  - hadamard-mlp
  - ogbl-ddi
  - feature-bootstrapping
baseline:
  use_fixed_features: false
device: cuda
log_level: INFO
num_clients: 5
num_rounds: 40
local_epochs: 5
fraction_evaluate: 1.0
fl:
  algorithm: fedavg
fedprox:
  mu: 1.0
local_observations:
  dirichlet_alpha: 0.5
  observations_per_client: null
  seed: null
poisoning:
  seed: null
  fraction_malicious: 0.0
  events: []
data_drift:
  seed: null
  events: []
defense:
  mode: none
  clip_multiplier: 1.5
  root_frac: 0.12
  caga_tol_z: 2.0
  caga_tol_abs: 0.0001
  caga_tol_rel: 0.0
  caga_probe_size: 4000
  caga_gate_blocks: true
  caga_final_check: true
  caga_max_sweeps: 2
  caga_max_rel_increase: 0.1
  caga_warmup_rounds: 0
  root_device: cpu
plotting:
  enabled: true
  save_dir: ./plots
  show: true
perf:
  dense_adj: false
  fast_negatives: false
  actor_cache: false
