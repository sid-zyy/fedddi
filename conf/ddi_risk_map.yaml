  - {template: '#DRUG may increase the orthostatic hypotensive, hypotensive, and antihypertensive activities of #DRUG.', type: hypotension, risk: high}  # 726
  - {template: 'The protein binding of #DRUG can be decreased when combined with #DRUG.', type: pk_change, risk: moderate}  # 686
  - {template: '#DRUG may increase the antihypertensive activities of #DRUG.', type: efficacy_change, risk: moderate}  # 663
  - {template: '#DRUG may increase the anticholinergic activities of #DRUG.', type: other, risk: low}  # 648
  - {template: 'The risk or severity of sedation, somnolence, and CNS depression can be increased when #DRUG is combined with #DRUG.', type: cns_depression, risk: high}  # 646
  - {template: 'The risk or severity of neutropenia and thrombocytopenia can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 637
  - {template: '#DRUG may decrease the hypoglycemic activities of #DRUG.', type: efficacy_change, risk: moderate}  # 629
  - {template: 'The risk or severity of electrolyte imbalance can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 610
  # ---- Keyword fallbacks (first match wins). Order matters: reductions before harms, harms before PK. ----
  # Reduced risk of an adverse effect.
  - {pattern: '^The risk or severity of .* can be decreased when', type: risk_decrease, risk: low}
  # Reduced toxic activity.
  - {pattern: 'may decrease the (nephrotoxic|cardiotoxic|arrhythmogenic) activities', type: risk_decrease, risk: low}
  # Reduced therapeutic or pharmacodynamic activity: an efficacy change.
  - {pattern: 'may decrease (the .* activities|effectiveness)', type: efficacy_change, risk: moderate}
  # High risk (the classes fixed in PUBLICATION_PLAN.md, Paper A, "Metric definitions").
  - {pattern: 'respiratory depression', type: respiratory_depression, risk: high}
  - {pattern: 'CNS depress|central nervous system depressant', type: cns_depression, risk: high}
  - {pattern: 'QTc|torsade', type: qtc_prolongation, risk: high}
  - {pattern: 'serotonin syndrome|serotonergic', type: serotonin_syndrome, risk: high}
  - {pattern: 'bleeding|hemorrhag|anticoagulant|antiplatelet', type: bleeding, risk: high}
  - {pattern: 'methemoglobinemia', type: methemoglobinemia, risk: high}
  - {pattern: 'hyperkalemi', type: hyperkalemia, risk: high}
  - {pattern: 'nephrotox|renal failure', type: nephrotoxicity, risk: high}
  - {pattern: 'hepatotox|liver damage|liver enzyme', type: hepatotoxicity, risk: high}
  - {pattern: 'cardiotox|cardiodepressant|myocardial depression|heart failure|cardiac arrest', type: cardiotoxicity, risk: high}
  - {pattern: 'tachycard', type: tachycardia, risk: high}
  - {pattern: 'arrhythm|bradycard|heart block|AV block|sinus node', type: arrhythmia, risk: high}
  - {pattern: 'seizure|convulsion', type: seizure, risk: high}
  - {pattern: 'rhabdomyolysis', type: rhabdomyolysis, risk: high}
  - {pattern: 'hypoglycemi', type: hypoglycemia, risk: high}
  - {pattern: 'hypotensi', type: hypotension, risk: high}
  - {pattern: '\bdeath\b', type: death, risk: high}
  # Moderate: pharmacokinetic and efficacy changes.
  - {pattern: 'serum concentration|serum level|metabolism of|excretion|absorption|bioavailability|protein binding', type: pk_change, risk: moderate}
  - {pattern: 'therapeutic efficacy|effectiveness of|antihypertensive activities', type: efficacy_change, risk: moderate}
  # Everything else (generic adverse effects, hypertension, GI irritation, sedation, ...) falls through to low.
