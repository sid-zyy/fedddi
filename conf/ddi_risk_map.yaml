  - {template: '#DRUG may increase the QTc-prolonging activities of #DRUG.', type: qtc_prolongation, risk: high}  # 880
  - {template: 'The risk or severity of sedation can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 876
  - {template: '#DRUG may increase the serotonergic activities of #DRUG.', type: serotonin_syndrome, risk: high}  # 875
  - {template: 'The risk or severity of tendinopathy can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 837
