# Risk classes for DrugBank interaction descriptions (Paper A, step 1).
#
# Each pair's description is turned into a template by replacing both drugs' names with "#DRUG"
# (src/data/ddi_risk.py). Rules are tried in order and the first match wins:
#   template: exact match on the whole template      pattern: case-insensitive regex search
# Anything unmatched is type "other", risk "low".
#
# Risk classes (fixed in PUBLICATION_PLAN.md, Paper A, "Metric definitions"):
#   high      CNS depression, QTc prolongation, bleeding, serotonin syndrome, hyperkalemia, nephrotoxicity,
#             hepatotoxicity, cardiotoxicity, arrhythmia, respiratory depression, seizures, rhabdomyolysis,
#             hypoglycemia, hypotension, methemoglobinemia, tachycardia (increased risk or activity only)
#   moderate  serum level, metabolism, excretion or absorption changes; efficacy changes
#   low       everything else, including generic "adverse effects", hypertension and reduced risks
# Judgement calls, recorded in the plan: increased anticoagulant/antiplatelet activity counts as bleeding;
# bradycardia, heart block and AV block as arrhythmia; renal failure as nephrotoxicity; "serotonergic
# activities" as serotonin syndrome; plain sedation (without "CNS depression") stays low.
#
# The first 60 rules are the 60 most frequent templates (counts in the trailing comment, DrugBank 5.1,
# approved small molecules), listed explicitly so the appendix table is exact. Templates that still
# contain a drug synonym (e.g. "Salbutamol" for albuterol) are left to the keyword fallbacks.
rules:
  # ---- Top 60 templates, explicit. ----
  - {template: '#DRUG may decrease the excretion rate of #DRUG which could result in a higher serum level.', type: pk_change, risk: moderate}  # 124620
  - {template: 'The metabolism of #DRUG can be decreased when combined with #DRUG.', type: pk_change, risk: moderate}  # 107440
  - {template: 'The risk or severity of CNS depression can be increased when #DRUG is combined with #DRUG.', type: cns_depression, risk: high}  # 44994
  - {template: 'The serum concentration of #DRUG can be increased when it is combined with #DRUG.', type: pk_change, risk: moderate}  # 44501
  - {template: 'The risk or severity of adverse effects can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 42459
  - {template: 'The therapeutic efficacy of #DRUG can be decreased when used in combination with #DRUG.', type: efficacy_change, risk: moderate}  # 38315
  - {template: 'The risk or severity of QTc prolongation can be increased when #DRUG is combined with #DRUG.', type: qtc_prolongation, risk: high}  # 30626
  - {template: 'The metabolism of #DRUG can be increased when combined with #DRUG.', type: pk_change, risk: moderate}  # 28349
  - {template: 'The risk or severity of hypertension can be increased when #DRUG is combined with #DRUG.', type: other, risk: low}  # 16375
  - {template: '#DRUG may decrease the antihypertensive activities of #DRUG.', type: efficacy_change, risk: moderate}  # 16116
  - {template: 'The risk or severity of methemoglobinemia can be increased when #DRUG is combined with #DRUG.', type: methemoglobinemia, risk: high}  # 14537
  - {template: 'The serum concentration of #DRUG can be decreased when it is combined with #DRUG.', type: pk_change, risk: moderate}  # 14033
  - {template: '#DRUG may increase the excretion rate of #DRUG which could result in a lower serum level and potentially a reduction in efficacy.', type: pk_change, risk: moderate}  # 11803
  - {template: '#DRUG may increase the hypotensive activities of #DRUG.', type: hypotension, risk: high}  # 10644
  - {template: 'The therapeutic efficacy of #DRUG can be increased when used in combination with #DRUG.', type: efficacy_change, risk: moderate}  # 8156
  - {template: '#DRUG may increase the central nervous system depressant (CNS depressant) activities of #DRUG.', type: cns_depression, risk: high}  # 8044
  - {template: 'The excretion of #DRUG can be decreased when combined with #DRUG.', type: pk_change, risk: moderate}  # 7717
  - {template: 'The risk or severity of nephrotoxicity can be increased when #DRUG is combined with #DRUG.', type: nephrotoxicity, risk: high}  # 5481
  - {template: 'The risk or severity of bleeding can be increased when #DRUG is combined with #DRUG.', type: bleeding, risk: high}  # 5382
